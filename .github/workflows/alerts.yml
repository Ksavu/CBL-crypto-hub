name: CBL alert checker
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Call alert checker
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS -m 40 -H "Authorization: Bearer $CRON_SECRET" https://cryptobarlounge.space/api/cron
