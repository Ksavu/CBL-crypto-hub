name: CBL alert checker
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Call alert checker
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "GitHub secret CRON_SECRET is empty or missing"; exit 1; fi
          code=$(curl -sS -m 40 -o body.txt -w "%{http_code}" -H "Authorization: Bearer $CRON_SECRET" https://cryptobarlounge.space/api/cron || true)
          echo "HTTP status: $code"
          cat body.txt || true
          echo
          wcode=$(curl -sS -m 40 -o wbody.txt -w "%{http_code}" -H "Authorization: Bearer $CRON_SECRET" "https://cryptobarlounge.space/api/cron?job=wallets" || true)
          echo "Wallet tracker HTTP status: $wcode"
          cat wbody.txt || true
          echo
          rcode=$(curl -sS -m 40 -o rbody.txt -w "%{http_code}" -H "Authorization: Bearer $CRON_SECRET" "https://cryptobarlounge.space/api/cron?job=radar" || true)
          echo "Token Radar HTTP status: $rcode"
          cat rbody.txt || true
          echo
          ccode=$(curl -sS -m 40 -o cbody.txt -w "%{http_code}" -H "Authorization: Bearer $CRON_SECRET" "https://cryptobarlounge.space/api/cron?job=calls" || true)
          echo "Group calls HTTP status: $ccode"
          cat cbody.txt || true
          echo
          vcode=$(curl -sS -m 40 -o vbody.txt -w "%{http_code}" -H "Authorization: Bearer $CRON_SECRET" "https://cryptobarlounge.space/api/cron?job=curves" || true)
          echo "Bonding curves HTTP status: $vcode"
          cat vbody.txt || true
          echo
          dcode=$(curl -sS -m 70 -o dbody.txt -w "%{http_code}" -H "Authorization: Bearer $CRON_SECRET" "https://cryptobarlounge.space/api/cron?job=devs" || true)
          echo "Dev history HTTP status: $dcode"
          cat dbody.txt || true
          echo
          case "$code" in 2*) exit 0 ;; *) exit 1 ;; esac
